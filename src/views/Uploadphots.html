<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Photos</title>
  
    <link rel="shortcut icon" href="./Images/Favicon.jpg" type="image/x-icon">
    <link rel="apple-touch-icon" href="./Images/Favicon.jpg">

  <link rel="stylesheet" href="Admin.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <h2>Dashboard</h2>
            <ul>
              <li><a href="Admin.html"><i class="fas fa-home"></i> Home </a></li>
              <li><a href="Uploadphots.html"><i class="fas fa-cloud-upload-alt"></i> Upload Photos</a></li>
              <li><a href="ManageUser.html"><i class="fas fa-users-cog"></i> Manage Users</a></li>
            </ul>
          </nav>

    <!-- Main Content -->
    <div class="main-content">
      <section class="content-section">
        <h3>Upload Photos</h3>
          <label for="photo-upload">Choose Photos</label>
          <button id="upload-btn">Upload File</button>
          <input id="file-input" type="file" name="file" style="display: none;" />
      </section>
    </div>
  </div>
  <script>
    const uploadBtn = document.getElementById('upload-btn');
    const fileInput = document.getElementById('file-input');

    uploadBtn.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', () => {
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      fetch('/api/upload', {
        method: 'POST',
        body: formData,
      })
        .then((response) => response.text())
        .then((data) => {
          document.body.innerHTML += '<p>' + data + '</p>';
        })
        .catch((error) => {
          console.error('Error uploading file:', error);
        });
    });
  </script>
</body>
</html>
